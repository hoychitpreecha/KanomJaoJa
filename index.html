<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Kanom JaoJa ❤️</title>
    
    <!-- โค้ดสำหรับดึงรูป logo.jpg ไปทำเป็นไอคอนบนหน้าจอมือถือ -->
    <link rel="icon" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Kanom JaoJa">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .logo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #d84315;
            margin-bottom: 5px;
            margin-top: 0;
        }
        p.subtitle {
            text-align: center;
            color: #777;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"], input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #d84315;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #bf360c;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ddd;
            margin: 30px 0;
        }
        .summary-card {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .summary-card h3 {
            margin-top: 0;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 10px;
        }
        .summary-details {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .total-profit {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(0,0,0,0.2);
        }
        .status-green {
            background-color: #e8f5e9;
            border-left: 6px solid #2e7d32;
        }
        .status-yellow {
            background-color: #fffde7;
            border-left: 6px solid #fbc02d;
        }
        .status-red {
            background-color: #ffebee;
            border-left: 6px solid #c62828;
        }
        /* แจ้งเตือนเวลาเซฟข้อมูล */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #4CAF50;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            padding: 15px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 16px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <!-- รูปภาพโลโก้ -->
        <img src="logo.jpg" alt="โลโก้ Kanom JaoJa">
    </div>
    
    <h1>❤️ Kanom JaoJa ❤️</h1>
    <p class="subtitle">ระบบบันทึกบัญชีร้าน (ข้อมูลถูกบันทึกในเครื่องนี้)</p>

    <div class="form-group">
        <label for="date">วันที่:</label>
        <input type="date" id="date" required>
    </div>
    <div class="form-group">
        <label for="income">ยอดรายรับรวม (บาท):</label>
        <input type="number" id="income" placeholder="0" min="0">
    </div>
    <div class="form-group">
        <label for="expense">ยอดต้นทุน/ซื้อของ (บาท):</label>
        <input type="number" id="expense" placeholder="0" min="0">
    </div>
    <button onclick="saveRecord()">บันทึก/อัปเดตข้อมูล</button>

    <hr>

    <h2>สรุปยอดรายเดือน</h2>
    <div id="summary-container"></div>
</div>

<div id="toast">บันทึกข้อมูลเรียบร้อย!</div>

<script>
    // ดึงข้อมูลเก่าจาก LocalStorage (หน่วยความจำในเครื่อง) ถ้าไม่มีให้เป็น Object ว่างๆ
    let records = JSON.parse(localStorage.getItem('jaoja_data')) || {};

    const dateInput = document.getElementById('date');
    const incomeInput = document.getElementById('income');
    const expenseInput = document.getElementById('expense');

    // ตั้งค่าเริ่มต้นเมื่อเปิดหน้าเว็บ
    window.onload = () => {
        dateInput.valueAsDate = new Date();
        loadDataForSelectedDate();
        updateSummary();
    };

    // ตรวจจับเมื่อมีการเปลี่ยนวันที่ ให้ดึงข้อมูลของวันนั้นมาแสดง
    dateInput.addEventListener('change', loadDataForSelectedDate);

    function loadDataForSelectedDate() {
        const selectedDate = dateInput.value;
        if (records[selectedDate]) {
            // ถ้ามีข้อมูลของวันนี้อยู่แล้ว ให้ดึงมาโชว์ในช่อง
            incomeInput.value = records[selectedDate].income || '';
            expenseInput.value = records[selectedDate].expense || '';
        } else {
            // ถ้าไม่มี ให้เป็นช่องว่าง
            incomeInput.value = '';
            expenseInput.value = '';
        }
    }

    function saveRecord() {
        const selectedDate = dateInput.value;
        const income = parseFloat(incomeInput.value) || 0;
        const expense = parseFloat(expenseInput.value) || 0;

        if (!selectedDate) {
            alert("กรุณาเลือกวันที่");
            return;
        }

        // บันทึก หรือ เขียนทับข้อมูลของวันนั้นๆ
        records[selectedDate] = { income: income, expense: expense };
        
        // เซฟลง LocalStorage ในเครื่อง
        localStorage.setItem('jaoja_data', JSON.stringify(records));

        // แสดงกล่องแจ้งเตือนว่าบันทึกแล้ว
        showToast();
        
        // อัปเดตหน้าสรุปผล
        updateSummary();
    }

    function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function updateSummary() {
        const container = document.getElementById('summary-container');
        container.innerHTML = '';

        const monthlyData = {};
        
        // วนลูปอ่านข้อมูลทุกวันที่มีในระบบ
        for (const date in records) {
            const data = records[date];
            const monthKey = date.substring(0, 7); // เอาแค่ปี-เดือน (YYYY-MM)
            
            if (!monthlyData[monthKey]) {
                monthlyData[monthKey] = { income: 0, expense: 0 };
            }
            monthlyData[monthKey].income += data.income;
            monthlyData[monthKey].expense += data.expense;
        }

        const sortedMonths = Object.keys(monthlyData).sort().reverse();

        sortedMonths.forEach(monthKey => {
            const data = monthlyData[monthKey];
            const profit = data.income - data.expense;
            
            let profitMargin = 0;
            if (data.income > 0) {
                profitMargin = (profit / data.income) * 100;
            } else if (data.income === 0 && data.expense > 0) {
                profitMargin = -100;
            }

            let statusClass = '';
            let statusText = '';
            
            if (profit < 0) {
                statusClass = 'status-red';
                statusText = '🔴 ขาดทุน';
            } else if (profitMargin >= 30) {
                statusClass = 'status-green';
                statusText = '🟢 กำไรดี';
            } else {
                statusClass = 'status-yellow';
                statusText = '🟡 กำไรปานกลาง';
            }

            const [year, month] = monthKey.split('-');
            const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
            const displayMonth = `${monthNames[parseInt(month) - 1]} ${year}`;

            const card = document.createElement('div');
            card.className = `summary-card ${statusClass}`;
            card.innerHTML = `
                <h3>เดือน: ${displayMonth} <span style="font-size:0.8em; float:right;">${statusText}</span></h3>
                <div class="summary-details">
                    <span>ยอดขายรวม:</span>
                    <span>${data.income.toLocaleString()} บาท</span>
                </div>
                <div class="summary-details">
                    <span>ต้นทุนรวม:</span>
                    <span>${data.expense.toLocaleString()} บาท</span>
                </div>
                <div class="summary-details total-profit">
                    <span>กำไรสุทธิ:</span>
                    <span>${profit.toLocaleString()} บาท (${profitMargin.toFixed(2)}%)</span>
                </div>
            `;
            container.appendChild(card);
        });

        if (sortedMonths.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#888;">ยังไม่มีข้อมูลในระบบ</p>';
        }
    }
</script>

</body>
</html>
